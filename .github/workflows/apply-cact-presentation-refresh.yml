name: Apply CACT presentation refresh

on:
  push:
    paths:
      - .github/workflows/apply-cact-presentation-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refreshed presentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const payload = [0, 1, 2, 3, 4]
            .map((index) => fs.readFileSync(`.github/cact-refresh/part${index}`, 'utf8').trim())
            .join('');
          const files = JSON.parse(zlib.gunzipSync(Buffer.from(payload, 'base64')).toString('utf8'));
          for (const [file, content] of Object.entries(files)) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content, 'utf8');
          }
          NODE
          rm -rf .github/cact-refresh .github/workflows/apply-cact-presentation-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish CACT presentation and simplify homepage"
          git push
